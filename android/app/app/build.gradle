plugins { id 'com.android.application' }
android {
    namespace 'io.github.braxxa.lasrecomp'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.braxxa.lasrecomp'
        minSdk 33
        targetSdk 34
        versionCode 2
        versionName '0.1.0-experimental'
        ndk { abiFilters 'arm64-v8a' }
    }
    sourceSets {
        main {
            jniLibs.srcDirs = ['../../../build/android/apk-libs']
            assets.srcDirs = ['../../../build/android/apk-assets']
        }
    }
    packaging { jniLibs { useLegacyPackaging = true; keepDebugSymbols += ['**/liblasgame.so'] } }
    buildTypes { debug { debuggable true } }
}
dependencies { implementation files('../../../build/android/sdl/SDL3-3.4.16.aar') }
